[package]
name = "coveragecraft"
description = "CoverageCraft: plan Wi-Fi coverage on floor plans from CADCraft and models from SolidCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coveragecraft-engine = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui = "0.37"
rfd = "0.15"
png = { workspace = true }
craft-window = { workspace = true }
craft-menu = { workspace = true }

[lints]
workspace = true
