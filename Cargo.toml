[workspace]
resolver = "2"
members = ["crates/radiocraft-engine", "apps/radiocraft", "apps/radiocraft-cli"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/radiocraft"
rust-version = "1.90"

[workspace.dependencies]
radiocraft-engine = { path = "crates/radiocraft-engine" }
# craft-libs crates, all at one merged `rev` of storytold/craft-libs `main`.
craft-dxf = { git = "https://github.com/storytold/craft-libs", rev = "8f6ad14b58ca2efee67aac5d0f5573bad6a5ca81" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "8f6ad14b58ca2efee67aac5d0f5573bad6a5ca81", default-features = false, features = ["stl", "obj"] }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "8f6ad14b58ca2efee67aac5d0f5573bad6a5ca81", features = ["egui"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "8f6ad14b58ca2efee67aac5d0f5573bad6a5ca81" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
